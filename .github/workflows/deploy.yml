name: Automatyczne wdrożenie na FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Wyślij pliki na serwer FTP
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Zsynchronizuj pliki z FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /home/host736196/domains/godot.host736196.xce.pl/public_html/olaf-vs-pierogi/
	  protocol: ftps
          security: loose
          timeout: 60000
          log-level: verbose